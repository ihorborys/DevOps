# Кількість реплік
replicaCount: 2

image:
  repository: 564415061836.dkr.ecr.us-west-2.amazonaws.com/django-app-repo
  pullPolicy: IfNotPresent
  tag: "v15"

service:
  type: LoadBalancer
  port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Налаштування для ConfigMap
configData:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: "django-app-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "django_user"

# Секція PostgreSQL — ВИПРАВЛЕНО для Argo CD та AWS
postgresql:
  enabled: true
  # ВАЖЛИВО: додаємо пароль прямо сюди, щоб secrets.yaml його побачив
  password: "pass9764gd"
  auth:
    database: "django_db"
    username: "django_user"
    password: "pass9764gd"
  primary:
    persistence:
      # Вимикаємо диски, щоб прибрати статус Pending у PVC
      enabled: false