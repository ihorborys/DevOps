# Кількість реплік для Django
replicaCount: 1

image:
  repository: 564415061836.dkr.ecr.us-west-2.amazonaws.com/django-app-repo
  pullPolicy: Always
  tag: "latest"

service:
  type: LoadBalancer
  port: 80

# Налаштування автоскейлінгу (згідно з ДЗ: 2-6 реплік)
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Загальні налаштування (ConfigMap)
configData:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "django_user"

# Секція для PostgreSQL та Secret
# Дані звідси підуть у postgres.yaml та secrets.yaml
postgresql:
  dbName: "django_db"
  user: "django_user"
  password: "pass9764gd"
  storageSize: 1Gi           # Розмір диска для PVC