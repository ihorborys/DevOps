# Кількість реплік (згідно з HPA)
replicaCount: 2

image:
  repository: 564415061836.dkr.ecr.us-west-2.amazonaws.com/django-app-repo
  pullPolicy: IfNotPresent
  tag: "v15"

service:
  type: LoadBalancer
  port: 80

# Налаштування автоскейлінгу
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Загальні налаштування (ConfigMap)
configData:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  # ВИПРАВЛЕНО: назва хоста має збігатися з назвою сервісу бази в K8s
  POSTGRES_HOST: "django-app-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "django_user"

# Секція для PostgreSQL
postgresql:
  # ВИПРАВЛЕНО: додаємо команду для запуску бази
  enabled: true
  auth:
    database: "django_db"
    username: "django_user"
    password: "pass9764gd"
  primary:
    persistence:
      size: 1Gi