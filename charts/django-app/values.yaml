replicaCount: 2

image:
  repository: 564415061836.dkr.ecr.us-west-2.amazonaws.com/django-app-repo
  pullPolicy: IfNotPresent
  tag: "v15"

service:
  type: LoadBalancer
  port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

configData:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: "django-app-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "django_user"

# Прописуємо паролі в усіх можливих місцях для secrets.yaml
db:
  password: "pass9764gd"
  user: "django_user"
  name: "django_db"

postgresql:
  enabled: true
  password: "pass9764gd"
  auth:
    database: "django_db"
    username: "django_user"
    password: "pass9764gd"
  image:
    registry: docker.io
    repository: postgres
    tag: 15-alpine
  primary:
    persistence:
      enabled: false