# Кількість реплік
replicaCount: 2

image:
  repository: 564415061836.dkr.ecr.us-west-2.amazonaws.com/django-app-repo
  pullPolicy: IfNotPresent
  tag: "v15"

service:
  type: LoadBalancer
  port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Налаштування для ConfigMap
configData:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  # ВАЖЛИВО: назва має бути саме такою для зв'язку всередині K8s
  POSTGRES_HOST: "django-app-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "django_db"
  POSTGRES_USER: "django_user"

# Секція PostgreSQL — ТУТ БУЛА ПОМИЛКА СТРУКТУРИ
postgresql:
  enabled: true
  # Ми додаємо пароль і сюди, і в auth, щоб Helm точно його знайшов
  password: "pass9764gd"
  auth:
    database: "django_db"
    username: "django_user"
    password: "pass9764gd"
  primary:
    persistence:
      size: 1Gi